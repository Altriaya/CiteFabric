name: Online release smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.13"
      - run: uv sync --locked
      - name: Run live arXiv golden path
        run: >-
          uv run python scripts/online_release_smoke.py
          --data-dir .citefabric/online-release-smoke
          --output online-release-smoke.json
